name: Login form Skill

on:
  push:
    branches: [main]
    paths:
      - 'skills/extract-login-form/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skill.yml'
  pull_request:
    paths:
      - 'skills/extract-login-form/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skill.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:skill
