name: Release build

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package extension
        run: cd dist && zip -r ../FormBridge-${GITHUB_REF_NAME}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: FormBridge-${{ github.ref_name }}
          path: FormBridge-${{ github.ref_name }}.zip
          if-no-files-found: error
